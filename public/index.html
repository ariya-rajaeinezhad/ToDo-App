<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <aside>
        <header class="aside-header">
            <h1> "My To-Do List" </h1>
        </header>
        <main class="aside-main">
            <div class="div-aside" data-view="add">
                <i class="bi bi-plus-circle"></i>
                <a href="javascript:void(0)">Add Task</a>
            </div>
            <div class="div-aside">
                <i class="bi bi-search"></i>
                <a href="javascript:void(0)">Search</a>
            </div>
            <div class="div-aside" data-view="today">
                <i class="bi bi-calendar-check"></i>
                <a href="javascript:void(0)">Today</a>
            </div>
            <div class="div-aside" data-view="upcoming">
                <i class="bi bi-calendar3"></i>
                <a href="javascript:void(0)">Upcoming</a>
            </div>
            <div class="div-aside" data-view="completed">
                <i class="bi bi-check-circle"></i>
                <a href="javascript:void(0)">Completed</a>
            </div>
        </main>
    </aside>
    <main>
        <div class="refresh-container">
            <button class="refresh">REFRESH!</button>
        </div>
        <section class="container-add">
            <p>- Add Task -</p>
            <form id="task-form" action="/add-task">
                <div>
                    <input type="text" placeholder="Enter The Task We Should Done Today: " class="input-task">
                </div>
                <div>
                    <input type="date" class="date-task">
                    <button class="button-task">SUBMIT!</button>
                </div>
            </form>
            <ul class="list-container">
            </ul>
        </section>
    </main>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
